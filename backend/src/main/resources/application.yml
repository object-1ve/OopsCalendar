server:
  port: 8080

spring:
  application:
    name: earnings-calendar
  jackson:
    default-property-inclusion: non_null

# FMP (Financial Modeling Prep) configuration.
# Provide a key via FMP_API_KEY env var or fmp.api-key in this file.
# Without a key the backend runs in MOCK mode (deterministic fake data),
# so the app is demo-able out of the box.
fmp:
  api-key: ${FMP_API_KEY:}
  base-url: https://financialmodelingprep.com/stable
  connect-timeout-ms: 8000
  read-timeout-ms: 15000
  min-request-interval-ms: 1500
  cache-ttl-seconds: 3600
  max-range-days: 120
  # FMP 上游失败后降级为 mock;此冷却时长后自动重试一次上游,成功即恢复
  degraded-retry-ms: 60000

# Finnhub(免费 key,财报日历覆盖完整):设置 FINNHUB_API_KEY 后启用。
# 数据源优先级:FINNHUB_API_KEY > FMP_API_KEY > mock(演示)。
finnhub:
  api-key: ${FINNHUB_API_KEY:}
  base-url: https://finnhub.io/api/v1
  connect-timeout-ms: 8000
  read-timeout-ms: 15000

cors:
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

logging:
  level:
    com.oops.calendar: INFO
