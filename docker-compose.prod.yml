services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/object-1ve/oops-calendar-backend:latest}
    restart: unless-stopped
    environment:
      FMP_API_KEY: ${FMP_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    volumes:
      - ./data:/app/data

  frontend:
    image: ${WEB_IMAGE:-ghcr.io/object-1ve/oops-calendar-frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
