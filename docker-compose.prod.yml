# 服务器用:只跑已有镜像,不在服务器上 build
# 本机: docker compose build && docker save ...
# 服务器: docker load && docker compose -f docker-compose.prod.yml up -d
services:
  backend:
    image: ${BACKEND_IMAGE:-oops-calendar-backend:latest}
    container_name: oops-calendar-backend
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      NEWS_DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
    volumes:
      - calendar_data:/app/data
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-oops-calendar-web:latest}
    container_name: oops-calendar-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  calendar_data:
    name: oops_calendar_data
