services:
  backend:
    image: ${BACKEND_IMAGE:?需在 .env 中设置 BACKEND_IMAGE(如 ghcr.io/object-1ve/oops-calendar-backend:1.2.3)}
    restart: unless-stopped
    environment:
      FMP_API_KEY: ${FMP_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    volumes:
      - ./data:/app/data

  frontend:
    image: ${WEB_IMAGE:?需在 .env 中设置 WEB_IMAGE(如 ghcr.io/object-1ve/oops-calendar-frontend:1.2.3)}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
