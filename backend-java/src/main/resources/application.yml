server:
  port: 8080

spring:
  application:
    name: earnings-calendar
  jackson:
    default-property-inclusion: non_null
  # 财报数据持久化:H2 文件库(位于 backend/data/earnings.mv.db)
  datasource:
    url: jdbc:h2:file:./data/earnings
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# FMP (Financial Modeling Prep) configuration.
# Provide a key via FMP_API_KEY env var or fmp.api-key in this file.
# Without a key the backend runs in MOCK mode (deterministic fake data),
# so the app is demo-able out of the box.
fmp:
  api-key: ${FMP_API_KEY:}
  base-url: https://financialmodelingprep.com/stable
  connect-timeout-ms: 8000
  read-timeout-ms: 15000
  min-request-interval-ms: 1500
  cache-ttl-seconds: 3600
  max-range-days: 120
  # FMP 上游失败后降级为 mock;此冷却时长后自动重试一次上游,成功即恢复
  degraded-retry-ms: 60000

# Finnhub(免费 key,财报日历覆盖完整):设置 FINNHUB_API_KEY 后启用。
# 数据源优先级:FINNHUB_API_KEY > FMP_API_KEY > mock(演示)。
finnhub:
  api-key: ${FINNHUB_API_KEY:}
  base-url: https://finnhub.io/api/v1
  connect-timeout-ms: 8000
  read-timeout-ms: 15000

# 财经快讯(金十/财联社/华尔街见闻/东方财富/雪球/格隆汇)。全部为公开接口,无需 API Key。
news:
  cache-ttl-seconds: 60
  max-items-per-source: 50
  max-items: 200
  # 后台增量轮询周期:每 15s 拉一次各源并只推送新增(每源 4 次/分钟,远低于风控阈值)
  poll-ms: 15000
  enabled: true
  # 数据源偏好持久化到 H2 数据库(news_preference 表);data-dir 仅用于首次启动时
  # 把旧版 news-preferences.json 一次性导入数据库(导入后不再读写该文件)
  data-dir: ./data
  connect-timeout-ms: 8000
  read-timeout-ms: 15000

cors:
  allowed-origins:
    - http://localhost:5174
    - http://127.0.0.1:5174

logging:
  level:
    com.oops.calendar: INFO
